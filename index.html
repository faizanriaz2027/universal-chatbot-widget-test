
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Universal Chatbot External Test</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    main {
      max-width: 800px;
      margin: 70px auto;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.7;
      color: #667085;
    }
  </style>
</head>

<body>
  <main>
    <h1>External Website Chatbot Test</h1>

    <p>
      This page is hosted separately from the chatbot
      backend. The floating chatbot is loaded from
      PythonAnywhere.
    </p>

    <p>
      Click the blue chat button in the bottom-right
      corner to test the integration.
    </p>
  </main>

  <script
    src="https://faizanriaz2027.pythonanywhere.com/assets/widget.js?v=20a1">
  </script>

  <script>
    if (window.UniversalChatbotWidget) {
      window.UniversalChatbotWidget.init({
        apiBaseUrl: "https://faizanriaz2027.pythonanywhere.com",
        widgetId: "demo-widget",
        title: "External Website AI Assistant",
        welcomeMessage: "Hello! How can I help you?",
        primaryColor: "#2463eb",
        language: "en"
      });
    } else {
      console.error("Chatbot widget failed to load");
    }
  </script>
</body>
</html>
